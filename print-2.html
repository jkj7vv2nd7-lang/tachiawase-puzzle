<style>
body{font-family:'Yu Gothic','Hiragino Sans',sans-serif; color:#000; margin:16px;}
h1{font-size:17pt; margin:0 0 2mm;} h2{font-size:12.5pt; margin:5mm 0 1.5mm;} p{font-size:10pt; margin:1mm 0;}
svg{display:block;} .cutline{stroke:#000; fill:none;}
.note{font-size:10.5pt; color:#444; border:1px solid #999; border-radius:2mm; padding:2.5mm 3mm; margin-bottom:5mm;}
.pbtn{font-size:13pt; font-weight:700; padding:2.5mm 8mm; margin-bottom:5mm; border:2px solid #2f5da3; border-radius:2.5mm; background:#fff; color:#2f5da3; cursor:pointer;}

</style>

<body>
<div class="note">印刷専用のページです。下の「印刷する」ボタンを押すと印刷ダイアログが開きます。<br>もし印刷物が白くなる場合は、<a href="print-2.pdf">PDF版（print-2.pdf）</a>を開いて、共有ボタンから「プリント」を選んでください。</div>
<button class="pbtn" onclick="window.print()">印刷する</button>
<h1>三平方の裁ち合わせパズル ― 型紙</h1><p>② 3・4・5の型（ペリガル分割 ― いちばん有名な三平方の組み立て）</p><h2>1. 元の図形 ― 線に沿って切り分けてください</h2><p>辺4の正方形（4分割）＋辺3の正方形</p><svg xmlns="http://www.w3.org/2000/svg" width="101.4mm" height="52.0mm" viewBox="0 0 7.80 4.00"><polygon points="2.000,2.000 4.000,0.500 4.000,0.000 0.500,0.000" class="cutline" stroke-width="0.108"></polygon><polygon points="2.000,2.000 0.500,0.000 0.000,0.000 0.000,3.500" class="cutline" stroke-width="0.108"></polygon><polygon points="2.000,2.000 0.000,3.500 0.000,4.000 3.500,4.000" class="cutline" stroke-width="0.108"></polygon><polygon points="2.000,2.000 3.500,4.000 4.000,4.000 4.000,0.500" class="cutline" stroke-width="0.108"></polygon><polygon points="4.800,4.000 7.800,4.000 7.800,1.000 4.800,1.000" class="cutline" stroke-width="0.108"></polygon></svg><h2>2. 完成形の枠 ― この形に組み替えてください</h2><p>斜辺の正方形（1辺 5）</p><svg xmlns="http://www.w3.org/2000/svg" width="65.0mm" height="65.0mm" viewBox="0 0 5.00 5.00"><polygon points="0.000,5.000 5.000,5.000 5.000,0.000 0.000,0.000" class="cutline" stroke-width="0.108"></polygon></svg><h2>3. 実寸の確認</h2><p>下の線がちょうど5cmになっていれば、実寸で印刷されています。</p><svg xmlns="http://www.w3.org/2000/svg" width="60mm" height="8mm" viewBox="0 0 60 8"><line x1="5" y1="2" x2="55" y2="2" stroke="#000" stroke-width="0.6"></line><line x1="5" y1="0" x2="5" y2="4" stroke="#000" stroke-width="0.6"></line><line x1="55" y1="0" x2="55" y2="4" stroke="#000" stroke-width="0.6"></line><text x="30" y="7.6" font-size="3.2" text-anchor="middle" fill="#000">5 cm</text></svg>
</body>
